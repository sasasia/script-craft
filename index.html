<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسکریپت‌کرفت | آموزش فیلم‌نامه‌نویسی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background-color: #111; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);">
        <nav style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <div style="font-size: 24px; font-weight: bold; color: #ffcc00;">🎬 ScriptCraft</div>
            <div style="font-size: 16px; color: #aaa;">هنرجو: خوش‌آمدید!</div>
        </nav>
    </header>

        <main style="max-width: 800px; margin: 40px auto; padding: 20px;">
                    <!-- بخش امتیاز و نوار پیشرفت -->
                <!-- بخش امتیاز و نوار پیشرفت ارتقا یافته -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #222; padding: 18px 25px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <div style="font-size: 16px; color: #fff; font-weight: bold;">امتیاز شما: <span id="user-score" style="color: #ffcc00;">0</span> 🌟</div>
            <div style="width: 65%; background-color: #3a3a3a; border-radius: 20px; height: 16px; overflow: hidden; padding: 2px;">
                <div id="progress-bar" style="width: 0%; background: linear-gradient(90deg, #ffd700, #ffcc00); border-radius: 20px; height: 100%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);"></div>
            </div>
        </div>


        <!-- باکس نمایش درس -->
        <div id="lesson-container" style="background-color: #2a2a2a; padding: 30px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
            <h2 id="lesson-title" style="color: #ffcc00;"></h2>
            <p id="lesson-content" style="font-size: 18px; line-height: 1.8; color: #ccc;"></p>
        </div>

        <!-- باکس نمایش آزمون (در ابتدا مخفی است) -->
        <div id="quiz-container" style="display: none; background-color: #222; padding: 30px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #ffcc00;">
            <h3 id="quiz-question" style="color: #fff; margin-bottom: 20px;">سوال آزمون اینجا قرار می‌گیرد</h3>
            <div id="options-container" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- گزینه‌ها با جاوااسکریپت اینجا ساخته می‌شوند -->
            </div>
            <p id="quiz-feedback" style="font-size: 16px; font-weight: bold; margin-top: 15px;"></p>
        </div>

        <button id="next-btn" style="background-color: #ffcc00; color: #000; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer;">درس بعدی ➔</button>
    </main>


    <script src="app.js"></script>
</body>
</html>
